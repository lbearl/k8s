apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Helm chart for kube-prometheus-stack
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 72.3.0
      helm:
        releaseName: kube-prometheus-stack
        valuesObject:
          grafana:
            admin:
              existingSecret: grafana-secret
              userKey: admin-user
              passwordKey: admin-password
            persistence:
              enabled: true
              size: 5Gi
            sidecar:
              dashboards:
                enabled: true
                searchNamespace: monitoring
          prometheus:
            prometheusSpec:
              retention: 30d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 20Gi
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
          alertmanager:
            alertmanagerSpec:
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 5Gi
            config:
              receivers:
                - name: "null"
                - name: telegram-webhook
                  webhook_configs:
                    - url: "https://hooks.bearl.me/webhook/alertmanager"
                      send_resolved: true
              route:
                receiver: "null"
                group_by: ["alertname", "namespace"]
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                routes:
                  - receiver: telegram-webhook
                    matchers:
                      - severity=~"critical|warning"
          kubeScheduler:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeProxy:
            enabled: false
          nodeExporter:
            enabled: true
          kubeStateMetrics:
            enabled: true
    # Additional manifests (ingress, namespace)
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/infra/k8s.git
      targetRevision: main
      path: workloads/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
