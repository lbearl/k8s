apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka-postgres
  namespace: planka
  labels:
    app: planka-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planka-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: planka-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: planka-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: planka-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planka-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planka-postgres-data
