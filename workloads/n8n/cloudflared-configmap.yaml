apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: n8n
data:
  config.yaml: |
    tunnel: n8n-webhooks
    no-autoupdate: true
    ingress:
      - hostname: hooks.bearl.me
        service: http://n8n-webhook-proxy.n8n.svc.cluster.local:8080
      - service: http_status:404
