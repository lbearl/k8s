apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: n8n
data:
  config.yaml: |
    tunnel: n8n-webhooks
    no-autoupdate: true
    ingress:
      - hostname: hooks.bearl.me
        path: "^/webhook(/.*)?$"
        service: http://n8n.n8n.svc.cluster.local:5678
      - hostname: hooks.bearl.me
        path: "^/webhook-test(/.*)?$"
        service: http://n8n.n8n.svc.cluster.local:5678
      - hostname: hooks.bearl.me
        path: "^/webhook-waiting(/.*)?$"
        service: http://n8n.n8n.svc.cluster.local:5678
      - service: http_status:404
