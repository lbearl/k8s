# Web search backend for the n8n assistant. Internal only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: n8n
data:
  settings.yml: |
    use_default_settings: true
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: n8n
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:latest@sha256:ddd642cae6eac75412938fd846ddbf440a2df029cfeae8a562b8b205f4e35e25
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-sandbox-secret
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: n8n
spec:
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
