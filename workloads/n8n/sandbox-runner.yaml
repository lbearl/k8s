# Privileged Docker-in-Docker runner that creates the sandboxes.
# Never expose via Ingress. Service name must stay sandbox-runner-1 (cert SAN).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner-1
  namespace: n8n
  labels:
    app: sandbox-runner-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-runner-1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sandbox-runner-1
    spec:
      enableServiceLinks: false
      containers:
        - name: runner
          image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.15.0@sha256:d6d2cdc163250d749d9442176264a05b65adca44660af541d1f0966b393b0806
          securityContext:
            privileged: true
          envFrom:
            - secretRef:
                name: n8n-sandbox-secret
          env:
            - name: SANDBOX_RUNNER_API_GRPC_ADDR
              value: sandbox-api:9090
            - name: SANDBOX_RUNNER_HTTP_BASE_URL
              value: https://sandbox-runner-1:8080
            - name: SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR
              value: ":9091"
            - name: SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR
              value: sandbox-runner-1:9091
            - name: SANDBOX_RUNNER_ID
              value: runner-1
            - name: SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE
              value: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.3.4
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE
              value: /tls/runner/ca.crt
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE
              value: /tls/runner/grpc-client.crt
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE
              value: /tls/runner/grpc-client.key
            - name: SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME
              value: sandbox-api
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
              value: /tls/runner/control-grpc-server.crt
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
              value: /tls/runner/control-grpc-server.key
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE
              value: /tls/runner/ca.crt
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9091
              name: control
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: tls
          persistentVolumeClaim:
            claimName: n8n-sandbox-tls
        - name: docker
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-runner-1
  namespace: n8n
spec:
  selector:
    app: sandbox-runner-1
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: control
      port: 9091
      targetPort: control
