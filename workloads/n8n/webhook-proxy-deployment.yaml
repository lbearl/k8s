apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook-proxy
  namespace: n8n
  labels:
    app: n8n-webhook-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-webhook-proxy
  template:
    metadata:
      labels:
        app: n8n-webhook-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine@sha256:b2f80f8f88146b0772fdcc7d92cea621aa8c2889fa8d07ed61d4884fcea53e09
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: review-access
              mountPath: /etc/nginx/review-access
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: review-access
          secret:
            secretName: justwin-review-access
        - name: config
          configMap:
            name: n8n-webhook-proxy-config
            items:
              - key: nginx.conf
                path: default.conf
