apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-webhook-proxy-config
  namespace: n8n
data:
  nginx.conf: |
    server {
      listen 8080;

      # Protect initial forms and every continuation, not just the first page.
      location ~ ^/(form/(justwin-intake|justwin-review)(/n8n-execution-status)?/?|form-waiting/[^/]+(/.*)?)$ {
        auth_basic "Justwin review";
        auth_basic_user_file /etc/nginx/review-access/htpasswd;
        add_header Cache-Control "no-store, no-transform" always;
        add_header Referrer-Policy "no-referrer" always;
        # Forms need same-origin requests for proxy Basic auth. This isolated
        # host exposes no editor; source content is escaped before rendering.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; sandbox allow-forms allow-scripts allow-same-origin allow-downloads allow-popups" always;
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_read_timeout 115s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik terminates HTTPS before this internal HTTP hop.
        proxy_set_header X-Forwarded-Proto https;
      }

      # Leave time for extraction and Asana calls, below Cloudflare's 125s limit.
      location = /webhook/email-to-asana {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_read_timeout 115s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook-test(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook-waiting(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        return 404;
      }
    }
