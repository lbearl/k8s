apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-webhook-proxy-config
  namespace: n8n
data:
  nginx.conf: |
    server {
      listen 8080;

      # Leave time for extraction and Asana calls, below Cloudflare's 125s limit.
      location = /webhook/email-to-asana {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_read_timeout 115s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook-test(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/webhook-waiting(/.*)?$ {
        proxy_pass http://n8n.n8n.svc.cluster.local:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        return 404;
      }
    }
