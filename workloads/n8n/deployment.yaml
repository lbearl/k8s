apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n@sha256:a8c95f75c6fdf65f5f2b7a7b354744eaa1c62bb911b5c00af6499c3f38e4cd32
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: POSTGRES_DB
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: POSTGRES_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: POSTGRES_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
            - name: WEBHOOK_URL
              value: "https://hooks.bearl.me/"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.home.bearl.me/"
            - name: N8N_COMMUNITY_PACKAGES_ENABLED
              value: "true"
            - name: N8N_RUNNERS_DISABLED
              value: "true"
            - name: GITEA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: GITEA_API_TOKEN
                  optional: true
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_API_KEY
                  optional: true
            - name: JUSTWIN_EMAIL_ENVELOPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: JUSTWIN_EMAIL_ENVELOPE_SECRET
                  optional: true
            - name: JUSTWIN_EMAIL_FRESHNESS_WINDOW_SECONDS
              value: "300"
            - name: GENERIC_TIMEZONE
              value: America/Chicago
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Raised from 1Gi: the container had grown to ~874Mi in normal
              # use over a few hours, so a single heavy execution could OOM it —
              # which kills every workflow on the instance, not just the one
              # that caused it.
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
