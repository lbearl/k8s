apiVersion: v1
kind: Namespace
metadata:
  name: sd-prompt-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sd-prompt-proxy-app
  namespace: sd-prompt-proxy
data:
  app.mjs: |
    import http from "node:http";

    const PORT = process.env.PORT || 8080;
    const SD_UPSTREAM = process.env.SD_UPSTREAM || "http://192.168.1.88:7860";
    const LLM_BASE_URL = process.env.LLM_BASE_URL || "http://192.168.1.151:11434/v1";
    const LLM_API_KEY = process.env.LLM_API_KEY || "unused";
    const LLM_MODEL = process.env.LLM_MODEL || "gemma4:latest";
    const LLM_MODE = process.env.LLM_MODE || "ollama"; // "ollama" or "openai"
    const MAX_TAGS = parseInt(process.env.MAX_TAGS || "15", 10);

    const SYSTEM_PROMPT = `You are a prompt converter. Convert the input into exactly ${MAX_TAGS} or fewer comma-separated SDXL booru-style tags. Rules:
    - Output ONLY comma-separated tags, nothing else
    - No sentences, no duplicates, no near-synonyms
    - Focus on: subject, appearance, action, setting, lighting, composition, quality
    - Always start with a quality tag like "masterpiece" or "best quality"
    - No explanations, no numbering`;

    async function rewritePrompt(prompt) {
      // Preserve LoRA/embedding tags and rewrite only the descriptive part
      const loraPattern = /<[^>]+>/g;
      const loras = prompt.match(loraPattern) || [];
      const descriptive = prompt.replace(loraPattern, "").trim();
      if (!descriptive) return prompt;

      let url, body;
      if (LLM_MODE === "ollama") {
        url = LLM_BASE_URL.replace("/v1", "") + "/api/chat";
        body = JSON.stringify({
          model: LLM_MODEL,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: descriptive },
          ],
          stream: false,
          think: false,
        });
      } else {
        url = `${LLM_BASE_URL}/chat/completions`;
        body = JSON.stringify({
          model: LLM_MODEL,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: descriptive },
          ],
          temperature: 0.3,
          max_tokens: 200,
        });
      }
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${LLM_API_KEY}`,
        },
        body,
      });
      if (!res.ok) {
        console.error(`LLM error: ${res.status} ${await res.text()}`);
        return prompt;
      }
      const data = await res.json();
      let tags;
      if (LLM_MODE === "ollama") {
        tags = data.message?.content?.trim() || descriptive;
      } else {
        tags = data.choices[0].message.content?.trim() || descriptive;
      }
      // Recombine: LoRAs first, then rewritten tags
      return [...loras, tags].join(", ");
    }

    function proxyRequest(req, res, body, customHeaders) {
      const url = new URL(req.url, SD_UPSTREAM);
      const headers = customHeaders || { ...req.headers, host: url.host };
      const proxyReq = http.request(
        url,
        { method: req.method, headers },
        (proxyRes) => {
          res.writeHead(proxyRes.statusCode, proxyRes.headers);
          proxyRes.pipe(res);
        }
      );
      proxyReq.on("error", (e) => {
        console.error("Upstream error:", e.message);
        res.writeHead(502);
        res.end("Bad Gateway");
      });
      if (body) proxyReq.write(body);
      proxyReq.end();
    }

    const server = http.createServer(async (req, res) => {
      if (req.method === "POST" && req.url?.includes("/sdapi/v1/txt2img")) {
        const chunks = [];
        for await (const chunk of req) chunks.push(chunk);
        const raw = Buffer.concat(chunks).toString();
        try {
          const payload = JSON.parse(raw);
          console.log(`Original prompt: ${payload.prompt?.substring(0, 100)}...`);
          if (payload.prompt) {
            payload.prompt = await rewritePrompt(payload.prompt);
            console.log(`Rewritten prompt: ${payload.prompt}`);
          }
          const body = JSON.stringify(payload);
          const fwdHeaders = { ...req.headers, host: new URL(SD_UPSTREAM).host, "content-length": String(Buffer.byteLength(body)) };
          delete fwdHeaders["transfer-encoding"];
          proxyRequest(req, res, body, fwdHeaders);
        } catch (e) {
          console.error("Parse error, forwarding as-is:", e.message);
          proxyRequest(req, res, raw);
        }
      } else {
        const chunks = [];
        for await (const chunk of req) chunks.push(chunk);
        const body = chunks.length ? Buffer.concat(chunks) : null;
        proxyRequest(req, res, body);
      }
    });

    server.listen(PORT, () =>
      console.log(`sd-prompt-proxy listening on :${PORT} → ${SD_UPSTREAM}`)
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sd-prompt-proxy
  namespace: sd-prompt-proxy
  labels:
    app: sd-prompt-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sd-prompt-proxy
  template:
    metadata:
      labels:
        app: sd-prompt-proxy
    spec:
      containers:
        - name: sd-prompt-proxy
          image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
          command: ["node", "/app/app.mjs"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SD_UPSTREAM
              value: "http://192.168.1.88:7860"
            - name: LLM_BASE_URL
              value: "http://192.168.1.151:11434/v1"
            - name: LLM_API_KEY
              value: "unused"
            - name: LLM_MODEL
              value: "gemma4:latest"
            - name: LLM_MODE
              value: "ollama"
            - name: MAX_TAGS
              value: "15"
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: sd-prompt-proxy-app
---
apiVersion: v1
kind: Service
metadata:
  name: sd-prompt-proxy
  namespace: sd-prompt-proxy
spec:
  selector:
    app: sd-prompt-proxy
  ports:
    - name: http
      port: 7860
      targetPort: http
  type: ClusterIP
