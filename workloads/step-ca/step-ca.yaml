apiVersion: v1
kind: Namespace
metadata:
  name: step-ca
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: step-ca-db
  namespace: step-ca
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
  namespace: step-ca
  labels:
    app: step-ca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: step-ca
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: step-ca
    spec:
      initContainers:
        - name: init-ca
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Build the /home/step directory structure from Secrets.
              # The PVC only holds the database; keys and config come from Secrets.
              mkdir -p /home/step/certs /home/step/secrets /home/step/config /home/step/db
              cp /mnt/certs/root_ca.crt /home/step/certs/root_ca.crt
              cp /mnt/certs/intermediate_ca.crt /home/step/certs/intermediate_ca.crt
              cp /mnt/keys/root_ca_key /home/step/secrets/root_ca_key
              cp /mnt/keys/intermediate_ca_key /home/step/secrets/intermediate_ca_key
              cp /mnt/keys/password /home/step/secrets/password
              cp /mnt/config/ca.json /home/step/config/ca.json
              cp /mnt/config/defaults.json /home/step/config/defaults.json
              chmod 600 /home/step/secrets/*
              chown -R 1000:1000 /home/step
          volumeMounts:
            - name: home
              mountPath: /home/step
            - name: db
              mountPath: /home/step/db
            - name: certs
              mountPath: /mnt/certs
            - name: keys
              mountPath: /mnt/keys
            - name: config
              mountPath: /mnt/config
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.27.2
          ports:
            - containerPort: 9000
              name: https
          volumeMounts:
            - name: home
              mountPath: /home/step
            - name: db
              mountPath: /home/step/db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: home
          emptyDir: {}
        - name: db
          persistentVolumeClaim:
            claimName: step-ca-db
        - name: certs
          secret:
            secretName: step-ca-certs
        - name: keys
          secret:
            secretName: step-ca-keys
            defaultMode: 0400
        - name: config
          secret:
            secretName: step-ca-config
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: step-ca
spec:
  selector:
    app: step-ca
  ports:
    - name: https
      port: 9000
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: step-ca
  namespace: step-ca
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: step-ca.home.bearl.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: step-ca
                port:
                  number: 9000
