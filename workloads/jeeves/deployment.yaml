apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeeves
  namespace: jeeves
spec:
  replicas: 1
  strategy:
    type: Recreate        # single writer: SQLite on a PVC + one Telegram long-poller
  selector:
    matchLabels:
      app: jeeves
  template:
    metadata:
      labels:
        app: jeeves
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: jeeves
          image: gitea.home.bearl.me/infra/jeeves:0.24.0@sha256:54945e0d792d817f0b248b980f56133ad073110ddeaaf20c85dadbe2b5dcd5ab
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ
              value: America/Chicago
            - name: PLANKA_URL
              value: http://planka.planka.svc.cluster.local:1337
            - name: JEEVES_MODE
              value: live                   # Phase 2: nudges go to their recipients (unreachable people fall back to Luke, labelled)
            - name: JEEVES_MATERIALIZE
              value: "1"                    # Phase 2: seeded recurring chores become cards (drip-fed, 5/day cap)
            - name: JEEVES_BACKUP_DIR
              value: /backups/jeeves
            - name: HA_URL
              value: https://home.bearl.me:8123   # resolves in-cluster to HA's LAN IP (coredns-custom); local-only read-only user
            - name: HA_TOKEN
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: HA_TOKEN } }
            # Private/public iCal addresses (read-only). Optional: a missing key just means that calendar is off.
            - name: JEEVES_CAL_LUKE
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: luke, optional: true } }
            - name: JEEVES_CAL_HOUSEHOLD          # the partly shared G+L calendar ('+' is not allowed in secret keys)
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: G-L_Calendar, optional: true } }
            - name: JEEVES_CAL_GWEN               # Gwen's public view
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: gwen_public, optional: true } }
            # Home Assistant voice ("Jeeves, what is on my list?"): off unless the token exists. Rooms are mapped to people here,
            # because who is speaking is never guessed from the words. Example: "office=luke,bedroom=gwen".
            - name: JEEVES_VOICE_TOKEN
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: voice_token, optional: true } }
            # Apple Focus sensors (HA companion app). Luke's phone is built in; add Gwen's once she shares hers, e.g.
            # "gwen=binary_sensor.gwens_iphone_focus". Messages are held while the recipient is asleep (see docs/RUNBOOK.md).
            - name: JEEVES_FOCUS_ENTITIES
              value: ""
            - name: JEEVES_VOICE_PEOPLE
              value: ""
            - name: PLANKA_API_KEY
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: PLANKA_API_KEY } }
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: TELEGRAM_BOT_TOKEN } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: LLM_API_KEY } }
            - name: JEEVES_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: jeeves-secret, key: JEEVES_WEBHOOK_SECRET } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: backups, mountPath: /backups }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jeeves-data
        - name: backups
          nfs:
            server: 192.168.1.246
            path: /volume1/k8s-backups
