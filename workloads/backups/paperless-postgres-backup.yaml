apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-postgres-backup
  namespace: paperless
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/paperless-postgres"
                  mkdir -p "${BACKUP_DIR}"

                  echo "Starting paperless postgres backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h paperless-postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                    --no-owner --clean --if-exists | gzip > "${BACKUP_DIR}/paperless-${TIMESTAMP}.sql.gz"

                  # Prune backups older than 30 days
                  find "${BACKUP_DIR}" -name "paperless-*.sql.gz" -mtime +30 -delete

                  echo "Backup complete: ${BACKUP_DIR}/paperless-${TIMESTAMP}.sql.gz"
                  ls -lh "${BACKUP_DIR}/"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secret
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.1.246
                path: /volume1/k8s-backups
