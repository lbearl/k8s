apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-postgres-backup
  namespace: n8n
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/n8n-postgres"
                  mkdir -p "${BACKUP_DIR}"

                  echo "Starting n8n postgres backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h n8n-postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                    --no-owner --clean --if-exists | gzip > "${BACKUP_DIR}/n8n-${TIMESTAMP}.sql.gz"

                  # Prune backups older than 30 days
                  find "${BACKUP_DIR}" -name "n8n-*.sql.gz" -mtime +30 -delete

                  echo "Backup complete: ${BACKUP_DIR}/n8n-${TIMESTAMP}.sql.gz"
                  ls -lh "${BACKUP_DIR}/"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secret
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: n8n-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.1.246
                path: /volume1/k8s-backups
