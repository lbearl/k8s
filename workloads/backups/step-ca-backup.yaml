apiVersion: batch/v1
kind: CronJob
metadata:
  name: step-ca-backup
  namespace: step-ca
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3am
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command:
                - sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/step-ca/${TIMESTAMP}"
                  mkdir -p "${BACKUP_DIR}/certs" "${BACKUP_DIR}/secrets" "${BACKUP_DIR}/config"

                  echo "Starting Step CA backup..."
                  cp /mnt/certs/root_ca.crt "${BACKUP_DIR}/certs/"
                  cp /mnt/certs/intermediate_ca.crt "${BACKUP_DIR}/certs/"
                  cp /mnt/keys/root_ca_key "${BACKUP_DIR}/secrets/"
                  cp /mnt/keys/intermediate_ca_key "${BACKUP_DIR}/secrets/"
                  cp /mnt/keys/password "${BACKUP_DIR}/secrets/"
                  cp /mnt/config/ca.json "${BACKUP_DIR}/config/"
                  cp /mnt/config/defaults.json "${BACKUP_DIR}/config/"
                  chmod 600 "${BACKUP_DIR}/secrets/"*

                  # Prune backups older than 90 days
                  find /backups/step-ca -maxdepth 1 -type d -mtime +90 -exec rm -rf {} +

                  echo "Backup complete: ${BACKUP_DIR}"
                  find "${BACKUP_DIR}" -type f
              volumeMounts:
                - name: certs
                  mountPath: /mnt/certs
                - name: keys
                  mountPath: /mnt/keys
                - name: config
                  mountPath: /mnt/config
                - name: backups
                  mountPath: /backups
          volumes:
            - name: certs
              secret:
                secretName: step-ca-certs
            - name: keys
              secret:
                secretName: step-ca-keys
            - name: config
              secret:
                secretName: step-ca-config
            - name: backups
              nfs:
                server: 192.168.1.246
                path: /volume1/k8s-backups
