apiVersion: batch/v1
kind: CronJob
metadata:
  name: workout-tracker-postgres-backup
  namespace: workout-tracker
spec:
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/workout-tracker-postgres"
                  mkdir -p "${BACKUP_DIR}"

                  echo "Starting workout-tracker postgres backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h workout-tracker-postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                    --no-owner --clean --if-exists | gzip > "${BACKUP_DIR}/workout-tracker-${TIMESTAMP}.sql.gz"

                  # Prune backups older than 30 days
                  find "${BACKUP_DIR}" -name "workout-tracker-*.sql.gz" -mtime +30 -delete

                  echo "Backup complete: ${BACKUP_DIR}/workout-tracker-${TIMESTAMP}.sql.gz"
                  ls -lh "${BACKUP_DIR}/"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: workout-tracker-secret
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: workout-tracker-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: workout-tracker-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.1.246
                path: /volume1/k8s-backups
