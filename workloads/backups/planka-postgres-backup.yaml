apiVersion: batch/v1
kind: CronJob
metadata:
  name: planka-postgres-backup
  namespace: planka
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_DIR="/backups/planka-postgres"
                  mkdir -p "${BACKUP_DIR}"

                  echo "Starting planka postgres backup..."
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                    -h planka-postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                    --no-owner --clean --if-exists | gzip > "${BACKUP_DIR}/planka-${TIMESTAMP}.sql.gz"

                  # Prune backups older than 30 days
                  find "${BACKUP_DIR}" -name "planka-*.sql.gz" -mtime +30 -delete

                  echo "Backup complete: ${BACKUP_DIR}/planka-${TIMESTAMP}.sql.gz"
                  ls -lh "${BACKUP_DIR}/"
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: planka-secret
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: planka-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: planka-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              nfs:
                server: 192.168.1.246
                path: /volume1/k8s-backups
