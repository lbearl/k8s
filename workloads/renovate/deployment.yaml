apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: renovate-secret
  namespace: renovate
spec:
  itemPath: "vaults/k8s/items/renovate-secret"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
data:
  config.json: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "gitea",
      "endpoint": "http://gitea-http.gitea.svc.cluster.local:3000/api/v1",
      "gitUrl": "endpoint",
      "autodiscover": true,
      "autodiscoverFilter": ["infra/*"],
      "onboarding": false,
      "requireConfig": "optional",
      "hostRules": [
        {
          "matchHost": "github.com",
          "hostType": "github",
          "token": "{{ process.env.GITHUB_COM_TOKEN }}"
        }
      ],
      "extends": ["config:recommended", "docker:enableMajor"],
      "kubernetes": {
        "fileMatch": ["workloads/.+\\.yaml$", "argocd/.+\\.yaml$"]
      },
      "packageRules": [
        {
          "matchUpdateTypes": ["patch", "minor"],
          "automerge": true,
          "automergeType": "pr",
          "platformAutomerge": true
        },
        {
          "matchUpdateTypes": ["major"],
          "automerge": false
        },
        {
          "matchPackageNames": ["postgres"],
          "allowedVersions": "16.x",
          "description": "Pin Postgres to major 16 — major upgrades require dump/restore"
        }
      ]
    }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: renovate/renovate:43
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secret
                      key: RENOVATE_TOKEN
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secret
                      key: GITHUB_COM_TOKEN
                      optional: true
                - name: RENOVATE_CONFIG_FILE
                  value: /config/config.json
                - name: RENOVATE_GIT_URL
                  value: endpoint
                - name: LOG_LEVEL
                  value: info
                - name: GIT_SSL_NO_VERIFY
                  value: "true"
                - name: GIT_AUTHOR_NAME
                  value: "Renovate Bot"
                - name: GIT_AUTHOR_EMAIL
                  value: "renovate@home.bearl.me"
                - name: GIT_COMMITTER_NAME
                  value: "Renovate Bot"
                - name: GIT_COMMITTER_EMAIL
                  value: "renovate@home.bearl.me"
              volumeMounts:
                - name: config
                  mountPath: /config
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: config
              configMap:
                name: renovate-config
