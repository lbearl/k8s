apiVersion: apps/v1
kind: Deployment
metadata:
  name: marinara-engine
  namespace: marinara-engine
  labels:
    app: marinara-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marinara-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: marinara-engine
    spec:
      enableServiceLinks: false
      containers:
        - name: marinara-engine
          image: gitea.home.bearl.me/infra/marinara-engine:staging@sha256:18f9641f6a28de8e8fb8209de387b3a10be8b498f6c712457decbca8be192a0d
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /app/data
            - name: FILE_STORAGE_DIR
              value: /app/data/storage
            - name: MARINARA_DOCKER
              value: "true"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "7860"
            - name: TZ
              value: America/Chicago
            - name: ALLOW_UNAUTHENTICATED_PRIVATE_NETWORK
              value: "false"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://ai-chat.home.bearl.me"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: ENCRYPTION_KEY
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: ADMIN_SECRET
            - name: SIDECAR_RUNTIME_INSTALL_ENABLED
              value: "true"
            - name: IMAGE_LOCAL_URLS_ENABLED
              value: "true"
            - name: PROVIDER_LOCAL_URLS_ENABLED
              value: "true"
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: BASIC_AUTH_USER
            - name: BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: BASIC_AUTH_PASS
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marinara-engine-data
