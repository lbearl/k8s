apiVersion: apps/v1
kind: Deployment
metadata:
  name: marinara-engine
  namespace: marinara-engine
  labels:
    app: marinara-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marinara-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: marinara-engine
    spec:
      enableServiceLinks: false
      initContainers:
        # An unclean shutdown (node reboot, OOM kill) strands the engine's writer
        # lease at $FILE_STORAGE_DIR/.writer-lease. The restarted container gets the
        # same pod hostname and the same PID, so the stale lease looks like a live
        # owner and startup fails with StorageWriterLeaseError, forever.
        # replicas: 1 + strategy: Recreate guarantee a single writer, so it is safe
        # to clear the lease unconditionally before the engine starts.
        - name: clear-writer-lease
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - rm -rf /app/data/storage/.writer-lease
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: marinara-engine
          image: ghcr.io/pasta-devs/marinara-engine:2.5.1@sha256:2d17e6a8fe1f2eefc4f61b6af2a62d51cd8f4746b35b8b068df71a2259aae663
          ports:
            - containerPort: 7860
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /app/data
            - name: FILE_STORAGE_DIR
              value: /app/data/storage
            - name: MARINARA_DOCKER
              value: "true"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "7860"
            - name: TZ
              value: America/Chicago
            - name: ALLOW_UNAUTHENTICATED_PRIVATE_NETWORK
              value: "false"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://ai-chat.home.bearl.me"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: ENCRYPTION_KEY
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: ADMIN_SECRET
            - name: SIDECAR_RUNTIME_INSTALL_ENABLED
              value: "true"
            - name: IMAGE_LOCAL_URLS_ENABLED
              value: "true"
            - name: PROVIDER_LOCAL_URLS_ENABLED
              value: "true"
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: BASIC_AUTH_USER
            - name: BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: marinara-engine-secret
                  key: BASIC_AUTH_PASS
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const h=require('http');h.get('http://127.0.0.1:7860/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marinara-engine-data
