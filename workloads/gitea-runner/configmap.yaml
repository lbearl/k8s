apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: gitea-runner
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 20m
      fetch_timeout: 5s
      fetch_interval: 5s
    cache:
      enabled: false
    host:
      workdir_parent: /data/work
