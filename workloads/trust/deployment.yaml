apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust
  namespace: trust
  labels:
    app: trust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trust
  template:
    metadata:
      labels:
        app: trust
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: certs
              mountPath: /certs
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: html
          configMap:
            name: trust-site
        - name: certs
          configMap:
            name: step-ca-root-cert
---
apiVersion: v1
kind: Service
metadata:
  name: trust
  namespace: trust
spec:
  selector:
    app: trust
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trust
  namespace: trust
  annotations:
    cert-manager.io/cluster-issuer: step-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - trust.home.bearl.me
      secretName: trust-tls
  rules:
    - host: trust.home.bearl.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trust
                port:
                  number: 8080
