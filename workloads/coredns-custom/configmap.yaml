# CoreDNS custom configuration
# Resolves *.home.bearl.me to the ingress-nginx service inside the cluster.
# This allows pods (like Argo CD) to reach gitea.home.bearl.me without
# external DNS being configured first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  home-bearl-me.server: |
    home.bearl.me:53 {
        errors
        cache 30
        template IN A home.bearl.me {
            match .*\.home\.bearl\.me
            answer "{{ .Name }} 60 IN A 10.105.227.40"
            fallthrough
        }
        template IN A home.bearl.me {
            match ^home\.bearl\.me\.$
            answer "{{ .Name }} 60 IN A 10.105.227.40"
            fallthrough
        }
    }
