apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-tracker-postgres
  namespace: workout-tracker
  labels:
    app: workout-tracker-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-tracker-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: workout-tracker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workout-tracker-postgres-data
