apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-tracker
  namespace: workout-tracker
  labels:
    app: workout-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-tracker
  template:
    metadata:
      labels:
        app: workout-tracker
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: workout-tracker
          image: ghcr.io/lbearl/workout-tracker:main@sha256:9a498659ffbfdde16f0911653fa5167a6f11c7c1b0b8f67c6b53deb96367d771
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TZ_NAME
              value: America/Chicago
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@workout-tracker-postgres:5432/$(POSTGRES_DB)
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workout-tracker-secret
                  key: API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
