# 1Password item "workout-tracker-secret" in the k8s vault needs fields:
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (alphanumeric — it's embedded in a URL)
#   API_TOKEN (long random string; used by the PWA and the iOS Shortcut)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: workout-tracker-secret
  namespace: workout-tracker
spec:
  itemPath: "vaults/k8s/items/workout-tracker-secret"
