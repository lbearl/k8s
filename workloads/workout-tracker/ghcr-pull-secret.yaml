# Pull secret for the private ghcr.io/lbearl/workout-tracker image.
# 1Password item "ghcr-pull-secret" in the k8s vault needs ONE field labelled
# ".dockerconfigjson" whose value is:
#   {"auths":{"ghcr.io":{"auth":"<base64 of lbearl:GITHUB_PAT>"}}}
# where GITHUB_PAT is a classic token with only the read:packages scope.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-pull-secret
  namespace: workout-tracker
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: "vaults/k8s/items/ghcr-pull-secret"
