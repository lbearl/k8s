apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workout-tracker
  namespace: workout-tracker
  annotations:
    cert-manager.io/cluster-issuer: step-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workouts.home.bearl.me
      secretName: workout-tracker-tls
  rules:
    - host: workouts.home.bearl.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workout-tracker
                port:
                  number: 8080
