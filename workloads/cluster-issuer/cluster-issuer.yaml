# ClusterIssuer that uses Step CA's ACME endpoint.
# After Step CA is running, retrieve the root CA fingerprint:
#   kubectl exec -n step-ca deploy/step-ca -- step certificate fingerprint /home/step/certs/root_ca.crt
# Then update the caBundle or configure trust as needed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-issuer
spec:
  acme:
    server: https://step-ca.step-ca.svc.cluster.local:9000/acme/acme/directory
    privateKeySecretRef:
      name: step-ca-acme-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
