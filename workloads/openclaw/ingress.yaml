apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    cert-manager.io/cluster-issuer: step-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - openclaw.home.bearl.me
      secretName: openclaw-tls
  rules:
    - host: openclaw.home.bearl.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 18789
