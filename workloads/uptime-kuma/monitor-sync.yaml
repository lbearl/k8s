apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-kuma-monitor-sync
  namespace: uptime-kuma
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uptime-kuma-monitor-sync
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uptime-kuma-monitor-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: uptime-kuma-monitor-sync
subjects:
  - kind: ServiceAccount
    name: uptime-kuma-monitor-sync
    namespace: uptime-kuma
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-monitor-sync-script
  namespace: uptime-kuma
data:
  sync.py: |
    import os
    import sys

    from kubernetes import client, config
    from uptime_kuma_api import UptimeKumaApi, MonitorType, NotificationType

    # Some services don't serve anything meaningful at "/" (e.g. API-only
    # servers). Override the checked path for those here instead of faking
    # a root response in the service itself.
    PATH_OVERRIDES = {
        "step-ca.home.bearl.me": "/health",
    }

    # Alerts go through the existing n8n "AlertManager -> Telegram" workflow
    # (its Format Alert node understands Kuma's default webhook body), so the
    # Telegram bot credential stays in n8n.
    NOTIFICATION_NAME = "n8n Telegram"
    NOTIFICATION_URL = os.environ["N8N_ALERT_WEBHOOK_URL"]

    def monitor_url(host):
        return f"https://{host}{PATH_OVERRIDES.get(host, '')}"

    def desired_hosts():
        config.load_incluster_config()
        networking = client.NetworkingV1Api()
        hosts = set()
        for ing in networking.list_ingress_for_all_namespaces().items:
            for rule in ing.spec.rules or []:
                if rule.host:
                    hosts.add(rule.host)
        return hosts

    def ensure_notification(api):
        # isDefault attaches it to monitors created later. applyExisting
        # (attach to all current monitors) is only used on first creation so
        # later syncs don't undo a monitor someone detached on purpose.
        params = dict(
            name=NOTIFICATION_NAME,
            type=NotificationType.WEBHOOK,
            isDefault=True,
            webhookURL=NOTIFICATION_URL,
            webhookContentType="json",
        )
        for n in api.get_notifications():
            if n["name"] == NOTIFICATION_NAME:
                api.edit_notification(n["id"], **params)
                return
        api.add_notification(applyExisting=True, **params)
        print(f"added notification: {NOTIFICATION_NAME}")

    def main():
        hosts = desired_hosts()
        if not hosts:
            print("no ingress hosts found, refusing to touch monitors", file=sys.stderr)
            sys.exit(1)

        api = UptimeKumaApi(os.environ["KUMA_URL"])
        try:
            api.login(os.environ["KUMA_USERNAME"], os.environ["KUMA_PASSWORD"])
            ensure_notification(api)
            existing = {m["name"]: m for m in api.get_monitors()}

            for host in sorted(hosts):
                url = monitor_url(host)
                if host in existing:
                    if existing[host].get("url") != url:
                        api.edit_monitor(existing[host]["id"], url=url)
                        print(f"updated monitor url: {host} -> {url}")
                    continue
                api.add_monitor(
                    type=MonitorType.HTTP,
                    name=host,
                    url=url,
                    interval=60,
                    maxretries=2,
                    accepted_statuscodes=["200-299", "300-399", "401", "403"],
                )
                print(f"added monitor: {host}")

            for name, monitor in existing.items():
                if name.endswith(".home.bearl.me") and name not in hosts:
                    api.delete_monitor(monitor["id"])
                    print(f"removed stale monitor: {name}")
        finally:
            api.disconnect()

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uptime-kuma-monitor-sync
  namespace: uptime-kuma
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: uptime-kuma-monitor-sync
          restartPolicy: Never
          containers:
            - name: sync
              image: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
              imagePullPolicy: Always
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  # Right after a node reboot CoreDNS may not be answering yet;
                  # retry the install instead of failing the Job (and alerting).
                  for i in $(seq 1 10); do
                    pip install --quiet --no-cache-dir kubernetes uptime-kuma-api && break
                    [ "$i" = 10 ] && exit 1
                    echo "pip install failed (attempt $i), retrying in 30s" >&2
                    sleep 30
                  done
                  python /scripts/sync.py
              env:
                - name: KUMA_URL
                  value: "http://uptime-kuma.uptime-kuma.svc.cluster.local:3001"
                - name: N8N_ALERT_WEBHOOK_URL
                  value: "http://n8n.n8n.svc.cluster.local:5678/webhook/alertmanager"
                - name: KUMA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: uptime-kuma-secret
                      key: KUMA_USERNAME
                - name: KUMA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: uptime-kuma-secret
                      key: KUMA_PASSWORD
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: uptime-kuma-monitor-sync-script
